# ============================================================================
# DỰ ÁN: HỆ THỐNG QUẢN LÝ NHÀ HÀNG & GỌI MÓN QR TẠI BÀN (QUÁN MỘC POS & E-MENU)
# DOCKER COMPOSE: KHỞI CHẠY MÔI TRƯỜNG ẢO CHỈ VỚI 1 LỆNH DUY NHẤT
# ============================================================================

services:
  quan-moc-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quan-moc-pos-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - CONG_BACKEND=3001
      - JWT_SECRET=quan_moc_secret_key_jwt_2026_super_secure_production
      - JWT_EXPIRES_IN=24h
      - DB_PATH=/app/database/coSoDuLieu.sqlite
    volumes:
      # Mount volume để lưu trữ CSDL SQLite vĩnh viễn trên máy chủ vật lý
      - ./database/coSoDuLieu.sqlite:/app/database/coSoDuLieu.sqlite
      - ./database/saoLuu:/app/database/saoLuu
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/kiem-tra-suc-khoe').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
